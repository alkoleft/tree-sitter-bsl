name: Publish packages

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  build-python:
    name: Build Python distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build --sdist --outdir dist
          python -m twine check dist/*

      - name: Upload Python distribution
        uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish Python package to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Python distribution
        uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  build-npm:
    name: Build npm package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: env -u npm_config_devdir -u NPM_CONFIG_DEVDIR npm ci

      - name: Build and test Node binding
        run: |
          env -u npm_config_devdir -u NPM_CONFIG_DEVDIR npm run build:node
          env -u npm_config_devdir -u NPM_CONFIG_DEVDIR npm test

      - name: Pack npm tarball
        run: |
          mkdir -p npm-dist
          env -u npm_config_devdir -u NPM_CONFIG_DEVDIR npm pack --pack-destination npm-dist

      - name: Upload npm package
        uses: actions/upload-artifact@v6
        with:
          name: npm-dist
          path: npm-dist/
          retention-days: 7

  publish-npm:
    name: Publish npm package
    needs: build-npm
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Download npm package
        uses: actions/download-artifact@v7
        with:
          name: npm-dist
          path: npm-dist/

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm-dist/*.tgz --access public --provenance

  github-release:
    name: GitHub Release
    needs: [build-python, build-npm]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts/ -type f \( -name "*.whl" -o -name "*.tar.gz" -o -name "*.tgz" \) \
            -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: tree-sitter-hbk ${{ github.ref_name }}
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

name: Publish packages

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-python:
    name: Build Python source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build --sdist --outdir dist
          python -m twine check dist/*

      - name: Upload Python distribution
        uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: dist/
          retention-days: 7

  build-python-wheels:
    name: Build Python wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.0

      - name: Upload Python wheels
        uses: actions/upload-artifact@v6
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 7

  publish-pypi:
    name: Publish Python package to PyPI
    needs: [build-python, build-python-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Python distribution
        uses: actions/download-artifact@v7
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  github-release:
    name: GitHub Release
    needs: [build-python, build-python-wheels]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts/ -type f -name "*.tar.gz" \
            -exec cp {} release-assets/ \;
          find artifacts/ -type f -name "*.whl" \
            -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: tree-sitter-hbk ${{ github.ref_name }}
          files: release-assets/*
          overwrite_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
